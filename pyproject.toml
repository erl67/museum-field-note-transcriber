[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "museum-field-note-transcriber"
version = "0.1.0"
description = "Local historical field-note transcription, review and catalogue"
requires-python = ">=3.12"
dependencies = ["google-genai==2.23.0", "Pillow==12.1.1", "tzdata==2025.3", "httpx==0.28.1"]

[project.scripts]
fieldnotes = "fieldnotes.cli:main"

[tool.setuptools.packages.find]
include = ["fieldnotes*"]

